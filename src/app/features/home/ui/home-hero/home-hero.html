@let c = content();
<section class="hero" aria-labelledby="hero-title">
  <div class="bg" lgParallax="0.15">
    <picture>
      <source
        type="image/webp"
        srcset="/images/home/hero-960.webp 960w, /images/home/hero-1920.webp 1920w"
        sizes="(max-width: 60rem) 100vw, 65vw"
      />
      <img
        src="/images/home/hero-1920.jpg"
        srcset="/images/home/hero-960.jpg 960w, /images/home/hero-1920.jpg 1920w"
        sizes="(max-width: 60rem) 100vw, 65vw"
        width="1920"
        height="2880"
        fetchpriority="high"
        [alt]="c.imageAlt"
      />
    </picture>
  </div>

  <div class="content">
    <p class="kicker"><span class="slash" aria-hidden="true">/</span> {{ c.kicker }}</p>
    <h1 id="hero-title" class="title"><lg-logo class="logo" /> {{ c.title }}</h1>
    <p class="slogan">
      @for (line of c.slogan; track $index) {
        @if (!$first) {
          <br />
        }
        {{ line }}
      }
    </p>
    <span class="divider" aria-hidden="true"></span>
    <p class="text">{{ c.text }}</p>
    <a lgButton size="lg" class="cta" [routerLink]="c.cta.link">
      {{ c.cta.label }} <lg-icon class="arrow" name="arrow-right" />
    </a>
  </div>

  <p class="accent" aria-hidden="true">
    @for (line of c.accent; track $index) {
      @if (!$first) {
        <br />
      }
      {{ line }}
    }
  </p>
</section>
